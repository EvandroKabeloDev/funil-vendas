server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets com hash: cache agressivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nunca cachear: shell do app, service worker e config de runtime
    location = /index.html            { add_header Cache-Control "no-store"; }
    location = /sw.js                 { add_header Cache-Control "no-store"; }
    location = /env.js                { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-store"; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
